name: mine_guardian
description: "MineGuardian — Mine Safety & Compliance Platform"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0

  # State Management — BLoC
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  equatable: ^2.0.5

  # Firebase (Auth + Storage)
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2
  firebase_messaging: ^15.1.3

  # Local Database — SQLite (offline-first)
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # Networking
  http: ^1.2.2
  socket_io_client: ^2.0.3+1

  # Connectivity
  connectivity_plus: ^6.0.5

  # GPS & Location
  geolocator: ^13.0.1
  permission_handler: ^11.3.1

  # Camera & Media
  image_picker: ^1.1.2

  # Voice-to-text
  speech_to_text: ^7.0.0

  # Secure Storage (JWT)
  flutter_secure_storage: ^9.2.2

  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^9.1.7
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
